name: Diagnostika nedostupných desek

on:
  workflow_dispatch:
    inputs:
      kinds:
        description: "Druhy chyb (timeout,connect,tls,not_found,…); prázdné = všechny"
        default: "timeout,connect"
        required: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./harvester
      - name: Stav posledního sběru
        run: |
          git fetch --depth 1 origin data
          git worktree add --detach state FETCH_HEAD
      - run: python -m uredni_desky diagnose --boards state/boards.json --kinds "${{ inputs.kinds }}"
