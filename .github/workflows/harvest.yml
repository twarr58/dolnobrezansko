name: Sběr desek mikroregionu a nasazení

on:
  schedule:
    - cron: "17 * * * *" # každou hodinu
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "harvester/**", ".github/workflows/harvest.yml"]

# Výchozí práva jen ke čtení. Kód, který zpracovává cizí soubory (PDF, obrázky, Word, OCR), běží v úkolu
# harvest bez práva zápisu do repozitáře; stav do větve `data` ukládá samostatný úkol save-state a web
# nasazuje úkol deploy – ani jeden nic cizího nespouští.
permissions:
  contents: read

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: harvester/pyproject.toml
      - run: pip install -e "harvester[dev]"
      - run: pytest -q harvester

  harvest:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write # jen pro přihlášení ke Claude (Workload Identity Federation)
    # Claude: přihlášení bez klíče přes Workload Identity Federation (viz README). Pravidlo v Claude Console
    # přijímá jen token GitHubu z repo:twarr58/dolnobrezansko:ref:refs/heads/main.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: harvester/pyproject.toml
      - run: pip install ./harvester
      # OCR je volitelné (bez něj se skeny jen nepřečtou) – zaseknutý apt nesmí zastavit sběr.
      - name: OCR pro skenované přílohy
        timeout-minutes: 5
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT="-o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $APT install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-ces poppler-utils >/dev/null \
            || { sudo apt-get $APT update -qq && sudo apt-get $APT install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-ces poppler-utils >/dev/null; }
          tesseract --version | head -1

      - name: Načíst předchozí stav z větve data
        run: |
          if git fetch --depth 1 origin data; then
            git worktree add --detach state FETCH_HEAD
          else
            mkdir -p state
          fi

      - name: Znaky obcí z větve assets
        run: |
          if git fetch --depth 1 origin assets; then
            git worktree add --detach assets FETCH_HEAD
          else
            echo "Větev assets zatím není – web ukáže jen znaky z repozitáře"
          fi

      - name: Tunel k proxy v ČR
        continue-on-error: true # proxy je jen záloha – bez ní sběr pokračuje přímo
        uses: ./.github/actions/proxy-tunnel
        with:
          key: ${{ secrets.PROXY_SSH_KEY }}
          known-hosts: ${{ secrets.PROXY_SSH_KNOWN_HOSTS }}
          destination: ${{ secrets.PROXY_SSH_DEST }}

      - name: Sběr (mikroregion, přílohy, popisy)
        env:
          # Volitelné: proxy v ČR pro servery, které blokují zahraniční IP (viz README).
          HARVEST_FALLBACK_PROXY: ${{ secrets.HARVEST_FALLBACK_PROXY }}
          # Klíč k API edesky.cz (desky Vestce, Jesenice, Okrouhla a Březové-Oleška; jejich weby z GitHubu nejdou).
          EDESKY_API_KEY: ${{ secrets.EDESKY_API_KEY }}
          # Volitelné: shrnutí od Claude. Bez přihlášení se popisy dělají jen pravidly.
          # Doporučeno: Workload Identity Federation – ID z Claude Console jako proměnné repozitáře
          # (Settings → Secrets and variables → Actions → Variables; nejsou tajná). Alternativa: secret ANTHROPIC_API_KEY.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'claude-haiku-5-5' }}
          AI_LIMIT: ${{ vars.AI_LIMIT || '100' }}
          COUNCIL_AI_LIMIT: ${{ vars.COUNCIL_AI_LIMIT || '40' }}
        run: python -m uredni_desky region --out site/data --state state --assets assets

      - name: Sestavit web
        run: |
          rsync -a --exclude data web/ site/
          if [ -d assets/erby ]; then rsync -a --exclude index.json assets/erby/ site/erby/; fi

      - name: Připravit stav k uložení
        run: |
          mkdir -p state-out
          cp state/items.json.gz state/boards.json state-out/
          for f in docs.json.gz summaries.json.gz region_sources.json discovered.json obce.json newsletters.json events.json council.json parcely.json; do
            [ -f "state/$f" ] && cp "state/$f" state-out/ || true
          done

      - uses: actions/upload-artifact@v7
        with:
          name: state
          path: state-out
          retention-days: 1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  save-state:
    needs: harvest
    runs-on: ubuntu-latest
    permissions:
      contents: write # plný stav (items.json…) se ukládá do větve `data`
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: README.md
      - uses: actions/download-artifact@v8
        with:
          name: state
          path: state-out
      - name: Uložit stav do větve data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Větev drží jen poslední stav (jeden commit bez historie), aby repozitář nebobtnal.
          git worktree add --orphan -b data-next out
          cp state-out/* out/
          cd out
          git add -A
          git commit -qm "Stav sběru $(date -u +%FT%TZ)"
          git push -fq origin HEAD:data

  deploy:
    needs: harvest
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
