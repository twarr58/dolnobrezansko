name: Hledání desek všech obcí

# Celostátní hledání desek – jen ručně. Web teď ukazuje jen mikroregion (harvest.yml, příkaz region),
# který si chybějící desky svých obcí hledá sám.
on:
  workflow_dispatch:
    inputs:
      recheck:
        description: "Jen znovu prověřit nepodporované obce a nefunkční zdroje"
        type: boolean
        default: false

# Hledání (cizí weby) běží jen s právem čtení; do větve data zapisuje úkol save.
permissions:
  contents: read

concurrency:
  group: harvest # sdílí větev data se sběrem
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ./harvester
      - name: Stav z větve data
        run: |
          git fetch --depth 1 origin data
          git worktree add --detach state FETCH_HEAD
      - name: Hledání
        env:
          RECHECK: ${{ inputs.recheck && '--recheck' || '' }}
        run: python -m uredni_desky discover --out state/discovered.json --nkod state/boards.json $RECHECK
      - name: Připravit stav k uložení
        run: |
          mkdir -p state-out
          cp state/*.json state/*.gz state-out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: state
          path: state-out
          retention-days: 1

  save:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: README.md
      - uses: actions/download-artifact@v8
        with:
          name: state
          path: state-out
      - name: Uložit do větve data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --orphan -b data-next out
          cp state-out/* out/
          cd out
          git add -A
          git commit -qm "Hledání desek obcí $(date -u +%FT%TZ)"
          git push -fq origin HEAD:data
