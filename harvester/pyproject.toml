[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uredni-desky"
version = "0.1.0"
description = "Sběr úředních desek (OFN Úřední desky) z Národního katalogu otevřených dat do statických JSON souborů"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "cryptography>=42", "json-repair>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
uredni-desky = "uredni_desky.__main__:main"

[tool.setuptools.packages.find]
include = ["uredni_desky*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
