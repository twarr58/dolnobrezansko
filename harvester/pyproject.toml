[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "uredni-desky"
version = "0.1.0"
description = "Sběr úředních desek mikroregionu Dolnobřežansko včetně příloh a jednoduchých popisů do statických JSON souborů"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1", "cryptography>=50.0.2", "json-repair>=0.64.5", "lxml>=5", "pypdf>=6.21.4", "fonttools>=4.68.0", "anthropic>=2.6.0", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[project.scripts]
uredni-desky = "uredni_desky.__main__:main"

[tool.setuptools.packages.find]
include = ["uredni_desky*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
uredni_desky = ["data/*.json"]
